# ===========================================================================
# GLM-5.3-Flash NVFP4 (320B total / 18B active, natively multimodal MoE,
# hybrid sparse + linear attention) on 2x DGX Spark GB10, TP=2.
#
# RUNS ONLY ON THE PATCHED IMAGE glm53-flash-sm121:v8 — NOT on the stock
# vendor image. Build it on BOTH nodes from MiaAI-Lab's kit:
#   git clone https://github.com/MiaAI-Lab/GLM-5.3-Flash-NVFP4-Dual-DGX-Spark \
#     ~/glm53-mia
#   cd ~/glm53-mia/files && docker build --network=host -f Dockerfile \
#     -t glm53-flash-sm121:v8 .
# That layer = vendor vllm/vllm-openai:glm53-flash-arm64-cu130
#   + flashinfer 0.6.18.dev20260819 (+cubin, jit-cache REMOVED so no SM120 cubins)
#   + nvidia-nccl-cu13==2.30.7, nvidia-cutlass-dsl==4.6.2
#   + files/glm53-flash_SM121.py sm90  (seven in-place edits)
#
# WHY THE STOCK IMAGE CANNOT SERVE THIS MODEL
#   Stock vLLM offers capability 12 only FLASHINFER_MLA_SPARSE_SM120, which
#   demands the packed fp8_ds_mla KV layout: 584 B/token = 448 NoPE + 128 RoPE
#   (64 x bf16) + 8 scale, a literal in get_kv_cache_shape that the CUDA cache
#   kernels assume. DeepSeek-V4-Flash fits exactly (latent 448, rope 64), which
#   is why the ds4 lane runs here. GLM-5.3-Flash is NoPE — qk_rope_head_dim = 0,
#   kv_lora_rank = 512 — so it fails at warmup with
#     "concat_and_cache_mla ... pe_dim must be 64 for fp8_ds_mla".
#   Padding a zero 64-dim rope tail does not help: the 512-dim latent still does
#   not fit the 448-byte NoPE field. Upstream gap: vllm#45317; the SM12x sparse
#   work in vllm#41834 is wired for DeepSeek-V4-Flash only.
#
# WHAT THE PATCH DOES (all Python / JIT-source level, no CUDA rebuild)
#   1. platforms/cuda.py — capability 12 now also offers
#      FLASHINFER_MLA_SPARSE_SM90, ahead of the packed SM120 backend.
#   2. flashinfer_mla_sparse_sm90.py — capability gate becomes major in (9, 12),
#      plus the FA2 wrapper and an fp8 version gate.
#   3. flashinfer data/include/.../mla.cuh + mla/_core.py — FA2 fp8 CTA tile and
#      the fp8 SM12 gate (FlashInfer JIT-compiles these, hence no image rebuild).
#   4. cuda.py PDL off for SM12; indexer topk -1 in
#      sparse_attn_indexer_kpool.py; pid clamp in
#      models/glm5next/nvidia/ops/kpool_compress.py.
#   Net effect: SM90 NoPE sparse-MLA + FA2 with PLAIN fp8_e4m3 KV rows, which
#   have no fixed slot geometry, so latent 512 / rope 0 is simply a 512-wide row.
#
# Settings below are MiaAI-Lab's measured ones. Cross-checked against the
# NVIDIA thread's 2x-Spark report (23.08 tok/s at MTP=5, 200k ctx):
#   forums.developer.nvidia.com/t/glm-5-3-flash-320b-total-parameters-18b-active/381350/22
# gpu_memory_utilization 0.84 is load-bearing: 0.90+ fails vLLM's free-memory
# check on GB10 UMA (only ~110.9 of 121.7 GiB is free at startup).
# ===========================================================================
recipe_version: "1"
name: GLM-5.3-Flash-NVFP4
model: LibertAIDAI/GLM-5.3-Flash-NVFP4
runtime: vllm-distributed
min_nodes: 2
cluster_only: true
container: glm53-flash-sm121:v8
executor_config:
  entrypoint: ""
metadata:
  description: GLM-5.3-Flash NVFP4 (320B/18B-A multimodal MoE) on 2x DGX Spark GB10, TP=2, 256K ctx, SM90 sparse-MLA
  maintainer: local (leo)
  source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-NVFP4-Dual-DGX-Spark
  base_model: zai-org/GLM-5.3-Flash
  model_dtype: nvfp4
  kv_cache: fp8_e4m3
  vllm_version: "glm53-flash-sm121:v8 (vendor glm53-flash-arm64-cu130 + FI 0.6.18 + MiaAI SM121 sm90 patch)"
defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: glm-5.3-flash
  tensor_parallel: 2
  pipeline_parallel: 1
  # 0.90 fails the free-memory check on GB10; MiaAI use 0.84.
  gpu_memory_utilization: 0.84
  # Checkpoint is 1M-native; 262144 is the kit's default.
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 2048
  # Plain per-tensor fp8 rows — NOT the packed fp8_ds_mla layout.
  kv_cache_dtype: fp8_e4m3
  # Sized so the KDA linear-attention state page fits the attention page.
  block_size: 2304
  load_format: auto
  speculative_config: '{"method":"mtp","num_speculative_tokens":4}'
  limit_mm_per_prompt: '{"image":4,"video":1}'
env:
  # 320B MoE init is slow and marlin repacks the expert weights on load.
  VLLM_ENGINE_READY_TIMEOUT_S: "5400"
  HF_HUB_DISABLE_XET: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TRITON_CACHE_DIR: /cache/huggingface/jitcache/triton
  TORCH_EXTENSIONS_DIR: /cache/huggingface/jitcache/torch_extensions
  VLLM_CACHE_DIR: /cache/huggingface/jitcache/vllm
  FLASHINFER_WORKSPACE_BASE: /cache/huggingface/jitcache/flashinfer
  XDG_CACHE_HOME: /cache/huggingface/jitcache
  # CUDA arch (GB10 = sm_121a / Blackwell).
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  # NCCL over the ConnectX-7 link between the two Sparks (homelab standard).
  NCCL_NET: IB
  NCCL_IB_DISABLE: 0
  NCCL_IB_GID_INDEX: 3
  NCCL_CROSS_NIC: 1
  NCCL_CUMEM_ENABLE: 0
  NCCL_IGNORE_CPU_AFFINITY: 1
  NCCL_DEBUG: WARN
# Serve command. No --enable-prefix-caching (MiaAI's lane does not use it, and
# it changes the hybrid block-size auto-sizing). No --distributed-executor-backend:
# sparkrun's vllm-distributed runtime injects the multi-node flags itself, where
# MiaAI's kit uses its own Ray cluster instead.
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size {pipeline_parallel} \
      --moe-backend marlin \
      --enforce-eager \
      --load-format {load_format} \
      --dtype auto \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --speculative-config '{speculative_config}' \
      --limit-mm-per-prompt '{limit_mm_per_prompt}' \
      --skip-mm-profiling \
      --enable-auto-tool-choice \
      --tool-call-parser glm47 \
      --reasoning-parser glm45
