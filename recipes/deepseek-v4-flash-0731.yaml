# Recipe: DeepSeek-V4-Flash-0731 (official release) + DSpark drafter, NVFP4 KV,
#         1M ctx, for DGX Spark GB10, 2 nodes
# Source: tonyd2wild's forum-validated 0731 lane, adopted 2026-08-01:
#         https://forums.developer.nvidia.com/t/deepseek-v4-flash-0731-dspark-1m-nvfp4-kv-2x-dgx-spark/378824
#         https://github.com/tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark
#         Measured there (2x DGX Spark, TP=2): 55.4 tok/s mean / 78.4 peak decode,
#         60.2% draft acceptance, 2,639 tok/s prefill @ 100K.
#
# Container is vllm-dspark-runtime:dspark-nvfp4-stage-c-p4 — the local Stage-C
# build + tonyd2wild's Patch 4 + procps, built on BOTH nodes with
# docker/Dockerfile.dspark-0731-p4 (see its header for the build command).
# Patch 4 maps the DSpark draft shared-expert gate_up_proj w1/w3 tensors that
# the loader silently dropped — without it acceptance collapses ~60% -> ~26% on
# 0731 weights. procps is the sparkrun liveness-check requirement (same gotcha
# as Dockerfile.ds4-procps). Do NOT fall back to :dspark-nvfp4-stage-c.
#
# NB: the earlier Stage-C failure noted in deepseek-v4-flash-dspark.yaml was the
# pre-0731 preview checkpoint without Patch 4; this lane is the 0731 fix-forward.
# Unlike the aidendle94 dspark lane this uses NVFP4 KV (nvfp4_ds_mla) and the
# full 1M context (YaRN-calibrated ceiling; >1M needs VLLM_ALLOW_LONG_MAX_MODEL_LEN
# and extrapolates past training calibration — don't).
#
# Parsers: deepseek_v4 tool/reasoning parsers are registered in the Stage-C image
# (verified 2026-08-01); forum default runs thinking:false — flip
# chat_template_kwargs to '{"thinking":true}' for reasoning traces.

model: deepseek-ai/DeepSeek-V4-Flash-0731
container: vllm-dspark-runtime:dspark-nvfp4-stage-c-p4
defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: deepseek-v4-flash-0731
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 1048576
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 6
  kv_cache_dtype: nvfp4_ds_mla
  block_size: 256
  tool_call_parser: deepseek_v4
  reasoning_parser: deepseek_v4
  # Explicit start/end strings: without this, startup warns "Auto-initialization
  # of reasoning token IDs failed" and stray </think> tags leak into content
  # (seen 2026-08-01 via the LiteLLM /v1/messages path). Same fix as the MiaAI
  # compose lane. Takes effect on next relaunch.
  reasoning_config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
  speculative_config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic"}'
  chat_template_kwargs: '{"thinking":false}'
env:
  # Engine-ready timeout raised from the vLLM default 600s: cold-cache 2-node
  # loads (hy3 took 868s on 2026-08-15) outlive the default and cascade into
  # shm/NCCL "cancelled" crashes at load completion.
  VLLM_ENGINE_READY_TIMEOUT_S: "5400"
  # Mirrors recipes/deepseek-v4-flash-0731.env — keep the two in sync.
  # tonyd2wild's 0731 switch set; do NOT set VLLM_WORKER_MULTIPROC_METHOD here
  # (spawn default is what the Stage-C lane validates).
  HF_HUB_DISABLE_XET: '1'
  TRITON_CACHE_DIR: /cache/huggingface/jitcache/triton
  TORCH_EXTENSIONS_DIR: /cache/huggingface/jitcache/torch_extensions
  VLLM_CACHE_DIR: /cache/huggingface/jitcache/vllm
  FLASHINFER_WORKSPACE_BASE: /cache/huggingface/jitcache/flashinfer
  TVM_FFI_CACHE_DIR: /cache/huggingface/jitcache/tvm-ffi
  XDG_CACHE_HOME: /cache/huggingface/jitcache
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_USE_B12X_MOE: '1'
  VLLM_USE_B12X_WO_PROJECTION: '1'
  B12X_W4A16_TC_DECODE: '0'
  VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: '1'
  VLLM_DSPARK_CONFIDENCE_SCHEDULER: 'off'
  VLLM_DSPARK_LOCAL_ARGMAX: '1'
  VLLM_DSPARK_REPLICATE_MARKOV_W1: '1'
  VLLM_DSPARK_FUSED_MARKOV_ARGMAX: '0'
  VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: '0'
  VLLM_DSV4_B12X_COMPRESSED_MLA: '0'
  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: '0'
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: '12.1a'
  FLASHINFER_CUDA_ARCH_LIST: '12.1a'
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  TILELANG_CLEANUP_TEMP_FILES: '1'
  DG_JIT_USE_NVRTC: '0'
  # NB: Stage-C keeps nvcc in the venv, NOT /usr/local/cuda — pointing DeepGEMM
  # at the usual path aborts weight post-processing with an Assertion error
  # "std::filesystem::exists(nvcc_path)" (hit 2026-08-01).
  DG_JIT_NVCC_COMPILER: /opt/env/bin/nvcc
  NCCL_NET: IB
  NCCL_IB_DISABLE: '0'
  NCCL_IB_GID_INDEX: '3'
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_ROCE_VERSION_NUM: '2'
  NCCL_CROSS_NIC: '1'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_IGNORE_CPU_AFFINITY: '1'
  NCCL_NVLS_ENABLE: '0'
  NCCL_DEBUG: WARN
# Full binary path below: the Stage-C image keeps vllm in /opt/env/bin, which is
# NOT on the container PATH — bare `vllm` exits immediately (hit 2026-08-01).
command: |
  /opt/env/bin/vllm serve {model} --host {host} --port {port} --trust-remote-code \
    --served-model-name {served_model_name} \
    -tp {tensor_parallel} --kv-cache-dtype {kv_cache_dtype} --block-size {block_size} \
    --gpu-memory-utilization {gpu_memory_utilization} --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --async-scheduling --enable-chunked-prefill --enable-prefix-caching \
    --generation-config vllm \
    --tool-call-parser {tool_call_parser} --reasoning-parser {reasoning_parser} \
    --reasoning-config '{reasoning_config}' \
    --enable-auto-tool-choice \
    --default-chat-template-kwargs '{chat_template_kwargs}' \
    --speculative-config '{speculative_config}'
runtime: vllm
min_nodes: 2
metadata:
  description: DeepSeek-V4-Flash-0731 + DSpark drafter, NVFP4 KV, 1M ctx (tonyd2wild lane, Patch 4)
recipe_version: '2'
