# Recipe: MiMo-V2.5 NVFP4 Omni (multimodal) for DGX Spark GB10, 2 nodes, 1M ctx
# Source: https://github.com/MiaAI-Lab/MiMo-V2.5-vLLM-Dual-DGX-Sparks
#
# Xiaomi MiMo-V2.5 (lukealonso NVFP4 quant) across 2x DGX Spark (GB10), TP=2,
# nvfp4 KV via the triton_attn_diffkv backend (DiffKV mod), MTP1 speculative
# decoding, 1M-token context. OMNI multimodal lane: text + image + video +
# audio. Uses MiaAI's PUBLISHED image (Tony's Spark DEV vLLM fork,
# 0.21.1rc1.dev85, with 7 runtime mods baked in: nvfp4-kv-diffkv,
# fix-mimo-v2-vllm, fix-mimo-mtp-patches, mixed-precision load, per-node NCCL
# HCA, Prometheus router compat, page-cache drop).
#
# This is the DFlash-free lane — it replaces mimo-v2.5-dflash.yaml as the MiMo
# entry point (that recipe needed a locally-built image and a hand-placed
# drafter; this one is pull-and-go). The dflash yaml is kept for reference.
# MiaAI numbers on this profile: ~30 tok/s single-stream, ~56 tok/s aggregate
# at C=3, ~2.7M-token KV pool at boot.
#
# COMMUNITY / UNVERIFIED on this host. MiaAI's own start.sh drives a Ray
# cluster (head+worker) — hence runtime vllm-ray here, matching their
# deployment; if sparkrun's vllm-ray runtime fails to form the 2-node cluster,
# that is the first thing to revisit (their RAY_TMPDIR=/dev/shm/ray, object
# store 1 GiB/node).

recipe_version: "1"
name: MiMo-V2.5-Omni
# MiaAI pins revision a147dd04… of this repo; sparkrun has no revision field —
# the host cache holds whatever was fetched, so re-pin manually if lukealonso
# force-pushes. Must be warm on BOTH nodes (containers run HF-offline).
model: lukealonso/MiMo-V2.5-NVFP4
runtime: vllm-ray
min_nodes: 2

# Requires two Sparks (1 GB10 each -> tensor_parallel 2). Will not run solo.
cluster_only: true

# Published tag (also :latest). Pull on BOTH nodes:
#     docker pull ghcr.io/miaai-lab/mimo-v2.5-vllm-dual-dgx-sparks:20260704
container: ghcr.io/miaai-lab/mimo-v2.5-vllm-dual-dgx-sparks:20260704

metadata:
  description: MiMo-V2.5 NVFP4 Omni (text/image/video/audio) on 2x DGX Spark GB10, TP=2, nvfp4 DiffKV, MTP1, 1M ctx
  maintainer: community (MiaAI-Lab/MiMo-V2.5-vLLM-Dual-DGX-Sparks)
  source: https://github.com/MiaAI-Lab/MiMo-V2.5-vLLM-Dual-DGX-Sparks
  base_model: XiaomiMiMo/MiMo-V2.5
  model_dtype: nvfp4
  kv_cache: nvfp4 (triton_attn_diffkv)
  draft_method: mtp1
  vllm_version: "0.21.1rc1.dev85+gd87ee1893 (Tony's Spark DEV fork + MiaAI mods)"

# Defaults — override on the CLI with -o key=value or the dedicated flags.
# Values are MiaAI's validated profile verbatim (only the port differs — the
# homelab convention is :8000; MiaAI serves on :8888).
defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: MiMo-V2.5-NVFP4
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.83
  # MiaAI runs 1M at GMU 0.83, but on THIS pair vLLM's profiled KV headroom
  # came out at 9.01 / 6.31 / 5.67 GiB across three launches (estimated max
  # seq len 817K / 565K / 506K — the variance survives a page-cache drop, so
  # don't bother chasing it). Raising GMU is off the table (0.84 OOMed by
  # ~40 MiB in MiaAI's own testing). 450K sits under the worst observed
  # estimate. Verified 2026-07-24.
  max_model_len: 450000
  max_num_seqs: 3
  max_num_batched_tokens: 2048
  block_size: 64
  kv_cache_dtype: nvfp4

# Environment variables — VERBATIM from MiaAI's recipe/env.sh (2026-07-23).
# Their comments are load-bearing: RAY_memory_monitor_refresh_ms=0 stops Ray
# false-killing TP0 post-warmup; GMU 0.83 is validated (0.84 OOMs ~40MiB at 1M);
# safetensors NOT instanttensor (instanttensor wedges the MTP+NVFP4-KV load).
# Per-node NCCL_IB_HCA / NCCL_SOCKET_IFNAME / GLOO_SOCKET_IFNAME are left to
# sparkrun. NB their env.sh also caps Ray's object store at 1 GiB via
# `ray start --object-store-memory=1073741824` — sparkrun's vllm-ray runtime
# controls ray start, so that cap is NOT applied here; revisit if OOM on load.
env:
  # Engine-ready timeout raised from the vLLM default 600s: cold-cache 2-node
  # loads (hy3 took 868s on 2026-08-15) outlive the default and cascade into
  # shm/NCCL "cancelled" crashes at load completion.
  VLLM_ENGINE_READY_TIMEOUT_S: "5400"
  # NB: do NOT set VLLM_HOST_IP here. vLLM's ray executor needs it UNIQUE per
  # node (driver placement pin + worker unique-IP check); a recipe-level value
  # lands identically on both containers and fails the unique-IP check, while
  # omitting it entirely makes the driver self-detect a non-Ray-node 10.0.0.x
  # IP and time out the placement group (both verified 2026-07-23). It is set
  # per-node by the LOCAL sparkrun patch docker/patch-sparkrun.py — re-run that
  # after every `uv tool upgrade sparkrun`.
  # RAY_TMPDIR saga (all verified 2026-07-23, container runs as leo/1001):
  #  - default /tmp/ray: baked ROOT-OWNED into this image (built for MiaAI's
  #    root-running compose) -> ray start dies with PermissionError on
  #    /tmp/ray/ray_current_cluster and the head container exits in <1 s.
  #  - /dev/shm/ray (MiaAI's value): sparkrun containers get a small /dev/shm,
  #    Ray session files overflow it -> RuntimeEnvSetupError / missing
  #    runtime_env_setup logs.
  # A fresh leo-owned path on the container's regular fs avoids both.
  RAY_TMPDIR: /tmp/ray-leo
  RAY_memory_monitor_refresh_ms: "0"
  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "0"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  # NVFP4 weights + KV + WMMA decode (Tony speed profile)
  VLLM_NVFP4_GEMM_BACKEND: flashinfer-cutlass
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_FLASHINFER_MOE_BACKEND: throughput
  VLLM_NVFP4_INLINE: "1"
  VLLM_WMMA_DECODE: "1"
  VLLM_MIMO_MTP1_GREEDY_FAST: "1"
  # RoCE / NCCL (direct-cable 2-node; GID 3 = both MiaAI's and the homelab value)
  NCCL_IB_DISABLE: "0"
  NCCL_NET: IB
  NCCL_NET_PLUGIN: none
  NCCL_SOCKET_FAMILY: AF_INET
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_NET_GDR_LEVEL: LOC
  NCCL_PROTO: LL
  NCCL_MAX_NCHANNELS: "2"

# Serve command — VERBATIM from MiaAI's recipe/launch-omni.sh (2026-07-23),
# adapted to sparkrun placeholders. First attempt used a paraphrased
# `--num-speculative-tokens 1` flag from a README summary — that flag does not
# exist on this fork; the spec config is the JSON blob below (hardcoded:
# sparkrun v1 brace gotcha). Ray executor is REQUIRED (mp is single-host).
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --dtype auto \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size {pipeline_parallel} \
      --distributed-executor-backend ray \
      --load-format safetensors \
      --hf-overrides '{"architectures":["MiMoV2OmniForCausalLM"]}' \
      --limit-mm-per-prompt '{"image":4,"video":1,"audio":1}' \
      --mm-encoder-tp-mode data \
      --attention-backend triton_attn_diffkv \
      --moe-backend flashinfer_cutlass \
      --kv-cache-dtype {kv_cache_dtype} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --block-size {block_size} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --no-async-scheduling \
      --enable-auto-tool-choice \
      --tool-call-parser mimo \
      --reasoning-parser mimo \
      --default-chat-template-kwargs '{"enable_thinking":false}' \
      --speculative-config '{"method":"mtp","num_speculative_tokens":1,"use_local_argmax_reduction":false}' \
      --generation-config vllm \
      --enforce-eager \
      --disable-uvicorn-access-log \
      --host {host} \
      --port {port}
