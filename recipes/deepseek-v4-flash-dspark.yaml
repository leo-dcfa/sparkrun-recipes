# Recipe: DeepSeek-V4-Flash (DSpark drafter) for DGX Spark GB10, 2 nodes
# Source: Spark Arena benchmark b8b2fce6-d3f7-441d-97d3-6f4ef23426f5 (author J C,
#         same lineage as the aidendle94 sparkrun DS4 images) — 49.56 tok/s TG.
#         https://spark-arena.com/benchmark/b8b2fce6-d3f7-441d-97d3-6f4ef23426f5
#
# ARENA-VALIDATED SPARKRUN-NATIVE RECIPE, adopted verbatim 2026-07-23 (only
# additions: host/port/served_model_name defaults). Replaces two failed
# attempts at this lane the same day:
#   - the tonyd2wild Stage-C local build (previous version of this file)
#   - a hand-port of MiaAI's Anemll-image compose deploy, which produced
#     GARBLED decode output under sparkrun (deploy/deepseek-dspark/ retains
#     that compose lane for reference — launch with its start script, never
#     via sparkrun)
# Key differences from those: PLAIN fp8 KV (not experimental nvfp4_ds_mla),
# 384K ctx (not 1M), FLASHINFER_MLA_SPARSE_DSV4 attention backend, b12x MoE,
# JIT caches redirected under the mounted HF cache.
#
# NB: `make deepseek` (deepseek-v4-flash-1m.yaml) is the fp8+MTP 1M lane; this
# is the faster DSpark-drafter lane with a 384K ceiling.

model: deepseek-ai/DeepSeek-V4-Flash-DSpark
container: aidendle94/sparkrun-vllm-ds4-gb10:production-3.7
defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: deepseek-v4-flash-dspark
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 393216
  max_num_batched_tokens: 4096
  max_num_seqs: 128
  tool_call_parser: deepseek_v4
  max_cudagraph_capture_size: 128
  kv_cache_dtype: fp8
  tokenizer_mode: deepseek_v4
  reasoning_parser: deepseek_v4
  speculative_config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic"}'
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
  gen_config: '{"temperature":0.4}'
env:
  # NB (2026-07-24): do NOT set VLLM_WORKER_MULTIPROC_METHOD here.
  #  - fork  -> deterministic "CUDA driver initialization failed" on the
  #    aidendle94 images (both production-ready AND production-3.7, verified).
  #  - spawn (default) works, but has an INTERMITTENT failure when relaunching
  #    quickly after a stop: with ipc=host, the dying container's
  #    resource_tracker unlinks /dev/shm/mp-* semaphores while the new worker
  #    is rebuilding them -> FileNotFoundError in synchronize.__setstate__ ->
  #    head times out at c10d rendezvous ("1/2 clients joined").
  #    Mitigation: after `make stop`, wait ~20 s (and optionally clear stale
  #    /dev/shm/mp-* on both nodes) before relaunching this lane.
  VLLM_ENABLE_PCIE_ALLREDUCE: '0'
  VLLM_PCIE_ALLREDUCE_BACKEND: cpp
  TRITON_CACHE_DIR: /cache/huggingface/jitcache/triton
  TORCH_EXTENSIONS_DIR: /cache/huggingface/jitcache/torch_extensions
  VLLM_CACHE_DIR: /cache/huggingface/jitcache/vllm
  FLASHINFER_WORKSPACE_BASE: /cache/huggingface/jitcache/flashinfer
  TVM_FFI_CACHE_DIR: /cache/huggingface/jitcache/tvm-ffi
  XDG_CACHE_HOME: /cache/huggingface/jitcache
command: |
  vllm serve {model} --host {host} --port {port} --trust-remote-code \
    --served-model-name {served_model_name} \
    -tp {tensor_parallel} --kv-cache-dtype {kv_cache_dtype} --block-size 256 --load-format auto \
    --gpu-memory-utilization {gpu_memory_utilization} --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --compilation-config '{compilation_config}' --async-scheduling --no-scheduler-reserve-full-isl \
    --enable-chunked-prefill --enable-prefix-caching --enable-flashinfer-autotune \
    --tokenizer-mode {tokenizer_mode} --tool-call-parser {tool_call_parser} --reasoning-parser {reasoning_parser} \
    --enable-auto-tool-choice --override-generation-config '{gen_config}' \
    --default-chat-template-kwargs.thinking=true --default-chat-template-kwargs.reasoning_effort=high \
    --attention-backend FLASHINFER_MLA_SPARSE_DSV4 --moe-backend b12x --disable-custom-all-reduce \
    --speculative-config '{speculative_config}'
runtime: vllm
min_nodes: 2
recipe_version: '2'
